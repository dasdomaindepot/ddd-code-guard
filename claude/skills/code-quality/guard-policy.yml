# Merge-Policy des Code Guard.
#
# Diese Datei entscheidet, ob ein Stand durchgeht — nicht das Modell nach Gefühl.
# Ein Projekt darf sie ueberschreiben, indem es eine eigene .ai/guard-policy.yml
# ablegt; fehlt sie dort, gilt diese hier.

version: 1

# Was das deterministische Script liefert, ist nicht verhandelbar.
gates:
  # Ein roter Check ist ein Blocker, ausser er steht hier drin.
  fail_is_blocker: true
  # Fehlende Checks blockieren nicht, sind aber immer ein Befund.
  missing_is_blocker: false
  # Ein Lauf, der den Worktree veraendert hat, blockiert immer.
  side_effect_is_blocker: true

# Schwellen fuer die Befunde des semantischen Reviews.
severity:
  blocker:
    allowed: 0
    beschreibung: >
      Datenverlust, Sicherheitsluecke, kaputtes Deployment, verletzte
      Anforderung. Geht nie durch.
  high:
    allowed: 0
    beschreibung: >
      Architekturverstoss, fehlende Autorisierungspruefung, erfundene API,
      fehlende Migration zu einer Entity-Aenderung.
  medium:
    allowed: 3
    bei_ueberschreitung: yellow
    beschreibung: >
      N+1-Risiko, fehlender Testfall zu neuem Verhalten, unklare Benennung,
      Duplikat. Drei sind tolerierbar, mehr nicht.
      Mehr als drei blockieren nicht wie ein Blocker, setzen das Verdikt aber
      auf YELLOW: das ist kein Reflex-Fix, sondern eine Entscheidung, die
      ein Mensch trifft. Der Report muss dann ausdrücklich sagen, welche der
      MEDIUM-Befunde er für die dringendsten hält.
  low:
    allowed: unlimited
    beschreibung: >
      Stil, Kommentare, Kleinigkeiten. Werden berichtet, blockieren nie.

# Wenn eine Achse gar nicht geprueft werden konnte, zaehlt sie nicht als gruen.
unpruefbar_ist_nicht_gruen: true

# Anmeldung und Passwörter — Hausstandard vom 26.09.2026, gelesen von
# bin/check-auth-policy. Grundlage: BSI IT-Grundschutz ORP.4 (Edition 2023) und
# NIST SP 800-63B-4 (26.08.2025). Das BSI nennt Betreibern keine feste Länge
# (ORP.4.A22: „je nach Einsatzzweck und Schutzbedarf"), deshalb steht die Zahl hier.
auth:
  # Unter dieser Mindestlänge ist es ein harter Fehler.
  password_min_length: 12
  # Darunter nur ein Hinweis: NIST verlangt 15 Zeichen, wenn das Passwort der
  # einzige Faktor ist (mit Zweitfaktor genügen 8).
  password_min_length_recommended: 15
  # Wer eine Obergrenze setzt, muss mindestens so viel erlauben (NIST: ≥ 64;
  # BSI ORP.4.A23: die volle Länge muss geprüft werden). Darunter: Hinweis.
  password_max_length_at_least: 64
  # Abgleich mit geleakten Passwörtern (Symfony: NotCompromisedPassword).
  # BSI ORP.4.A8 verbietet Passwörter aus gängigen Listen. Fehlt er: Hinweis.
  password_leak_check: hint
  # Zeichenklassen-Zwang ist bewusst NICHT verlangt — NIST verbietet ihn, er
  # erzeugt „Sommer2026!".
  #
  # Temporäre Sperre nach Fehlversuchen (BSI ORP.4.A13). Pflicht für jede
  # Anmeldung mit Passwort; Symfony: login_throttling in der Firewall.
  login_throttling: required
  # Höchstens so viele Fehlversuche pro Intervall (Symfony-Standard: 5).
  login_max_attempts: 10

# Öffentliche Formulare (Kontakt, Registrierung, Newsletter) — gelesen von
# bin/check-form-protection.
forms:
  # Mindestens ein Honeypot-Feld oder ein Captcha (ALTCHA, Friendly Captcha,
  # hCaptcha, reCAPTCHA, Turnstile). Fehlt beides: harter Fehler.
  spam_protection: required
  # Zusätzlicher Schutz (Zeitsperre, ALTCHA, inhaltliche Spam-Erkennung,
  # selbst gehostetes Sprachmodell) ist eine Empfehlung, kein Muss.
  additional_protection: hint
