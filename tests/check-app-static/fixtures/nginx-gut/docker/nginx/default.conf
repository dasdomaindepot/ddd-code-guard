upstream php {
    server php:9000;
}

server {
    listen 80;
    server_name _;
    root /app/public;

    # Version nicht anzeigen
    server_tokens off;

    # Uploads auf die Größe der Constraints begrenzen
    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Front-Controller: nur index.php wird als PHP ausgeführt
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        internal;
    }
}
