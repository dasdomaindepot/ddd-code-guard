<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Anmelden — Beispiel-App</title>
</head>
<body>
  <a href="#inhalt">Zum Inhalt springen</a>
  <main id="inhalt">
  <h1>Anmelden</h1>
  <form action="/login" method="post">
    <label for="username">Benutzername</label>
    <input type="text" id="username" name="_username" autocomplete="username">
    <label for="password">Passwort</label>
    <input type="password" id="password" name="_password" autocomplete="current-password">
    <button type="submit">Anmelden</button>
  </form>
  </main>
</body>
</html>
