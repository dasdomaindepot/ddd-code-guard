<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Erreiche die Beispiel-Manufaktur telefonisch und über das Kontaktformular.">
  <title>Kontakt — Beispiel-Manufaktur</title>
  <link rel="canonical" href="https://www.example.com/kontakt/">
</head>
<body>
  <h1>Kontakt</h1>
  <p>So erreichst du uns.</p>
  <form action="/kontakt" method="post">
    <label for="name">Dein Name</label>
    <input type="text" id="name" name="name">
    <label for="email">E-Mail-Adresse</label>
    <input type="email" id="email" name="email">
    <label>Nachricht
      <textarea name="message"></textarea>
    </label>
    <div aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
    <input type="submit" value="Absenden">
  </form>
  <p>
    <a href="/">Zurück zur Startseite</a>
  </p>
  <div id="sfwdt123" class="sf-toolbar"><button></button><img src="x.png"></div>
</body>
</html>
