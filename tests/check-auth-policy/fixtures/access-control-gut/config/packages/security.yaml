security:
    password_hashers:
        App\Entity\User: auto
    access_control:
        - { path: '^/login', roles: PUBLIC_ACCESS }
        - { path: '^/admin', roles: ROLE_ADMIN }
        - { path: '^/', roles: ROLE_USER }
    providers:
        app_user_provider:
            memory:
                users:
                    admin:
                        password: admin
                        roles: [ROLE_ADMIN]
    firewalls:
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_parameter: _username
                password_parameter: _password
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: 15 minutes
            security: true
        when@test:
            main:
                form_login:
                    login_parameter: _username
                    password_parameter: _password
                login_throttling:
                    max_attempts: 10000
