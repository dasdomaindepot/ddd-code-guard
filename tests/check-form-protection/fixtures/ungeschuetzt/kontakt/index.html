<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Kontakt — Beispiel-Manufaktur</title>
</head>
<body>
  <h1>Kontakt</h1>
  <p>Senden Sie uns Ihre Anfrage.</p>
  <form method="post" action="/kontakt">
    <label>Ihr Name <input type="text" name="name"></label>
    <label>Ihre E-Mail <input type="email" name="email"></label>
    <label>Ihre Nachricht <textarea name="nachricht"></textarea></label>
    <button type="submit">Anfrage senden</button>
  </form>
</body>
</html>
