<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Konto anlegen — Beispiel-netzwerk</title>
</head>
<body>
  <h1>Konto anlegen</h1>
  <p>Erstellen Sie ihr Konto.</p>
  <form method="post" action="/register">
    <label>Ihre E-Mail <input type="email" name="email"></label>
    <label>Passwort <input type="password" name="password1"></label>
    <label>Passwort bestätigen <input type="password" name="password2"></label>
    <button type="submit">Registrieren</button>
  </form>
</body>
</html>
